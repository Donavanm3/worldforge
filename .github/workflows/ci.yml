name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wf
          POSTGRES_PASSWORD: wf
          POSTGRES_DB: wf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wf -d wf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Present so the integration tests run rather than skip.
      DATABASE_URL: postgresql://wf:wf@localhost:5432/wf_test
      REDIS_URL: redis://localhost:6379
      # Test-only value; real secrets come from the deployment environment.
      JWT_SECRET: ci-test-secret-that-is-long-enough-for-hs256-signing

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test
