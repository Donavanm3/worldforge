# WorldForge — Nginx site (spec 58, 59, 60).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/worldforge
#   sudo sed -i 's/worldforge.example.com/YOUR-DOMAIN/g' /etc/nginx/sites-available/worldforge
#   sudo ln -sf /etc/nginx/sites-available/worldforge /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR-DOMAIN      # adds the TLS block below
#
# The domain appears only here and in .env — nothing is hard-coded in the app.

upstream worldforge_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name worldforge.example.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name worldforge.example.com;

    # certbot --nginx fills in ssl_certificate / ssl_certificate_key here.

    # Behind Cloudflare the real client IP arrives in a header; without this
    # every request looks like it comes from the proxy and rate limiting is
    # useless. Enable only if you actually front this with Cloudflare.
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;   # see cloudflare.com/ips

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Frontend: static build output -------------------------------------
    root /home/worldforge/worldforge/packages/web/dist;
    index index.html;

    # Hashed assets are immutable and safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are client routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy ships stale asset links.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://worldforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;

        # Authenticated responses must never land in a shared cache (spec 60).
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # Stripe signs the exact bytes it sends, so nothing may rewrite this body.
    location = /api/payments/webhook {
        proxy_pass http://worldforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # --- WebSockets --------------------------------------------------------
    # Reserved for the realtime layer (spec 50). The upgrade headers are the
    # part everyone forgets, so they are in place ahead of the feature.
    location /socket/ {
        proxy_pass http://worldforge_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
